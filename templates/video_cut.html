{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">
    <div class="card">
      <div class="card-header py-3">
        <h5 class="mb-0 fw-bold"><i class="bi bi-scissors"></i> New Clip</h5>
        <small class="text-muted">Import a video to start editing</small>
      </div>
      <div class="card-body p-4">
        <form id="cutForm" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label fw-semibold">YouTube link <span class="text-muted fw-normal">(optional)</span></label>
                <div class="input-group">
                  <span class="input-group-text" style="background:var(--surface2);border-color:var(--border);"><i class="bi bi-youtube"></i></span>
                  <input type="text" name="url" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Or upload a local file</label>
                <input type="file" name="file" class="form-control" accept="video/*">
            </div>
            <div class="row mb-3">
                <div class="col-6">
                    <label class="form-label small fw-semibold">Start <span class="text-muted">(sec / hh:mm:ss)</span></label>
                    <input type="text" name="start_time" class="form-control form-control-sm" placeholder="0:00 or 80" value="0">
                </div>
                <div class="col-6">
                    <label class="form-label small fw-semibold">End <span class="text-muted">(sec / hh:mm:ss)</span></label>
                    <input type="text" name="end_time" class="form-control form-control-sm" placeholder="2:45 or 165">
                </div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="skip_unsilence" class="form-check-input" id="skipUnsilence">
                <label class="form-check-label small" for="skipUnsilence">Skip audio cleanup (already has quiet audio)</label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="skip_cropping" class="form-check-input" id="skipCropping">
                <label class="form-check-label small" for="skipCropping">Skip face cropping (no face or already framed)</label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="skip_subtitles" class="form-check-input" id="skipSubtitles">
                <label class="form-check-label small" for="skipSubtitles">Skip auto-generating subtitles (import manually later)</label>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Subtitle method</label>
                <select name="subtitle_method" class="form-select form-select-sm" id="subtitleMethod">
                    <option value="auto" selected>Auto (Gemini → Whisper fallback)</option>
                    <option value="google">Gemini API only</option>
                    <option value="whisper">Whisper local only</option>
                </select>
            </div>
            <div class="mb-3" id="geminiKeyGroup">
                <label class="form-label small fw-semibold">Your Gemini API key <span class="text-muted fw-normal">(optional – overrides defaults)</span></label>
                <div class="input-group">
                    <span class="input-group-text" style="background:var(--surface2);border-color:var(--border);"><i class="bi bi-key"></i></span>
                    <input type="password" name="gemini_user_key" class="form-control form-control-sm" placeholder="AIzaSy... your key" id="geminiKeyInput">
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="toggleKeyVisibility" title="Show/hide key"><i class="bi bi-eye"></i></button>
                </div>
                <small class="text-muted">Key is only used for this session – not stored on disk.</small>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-lightning-charge-fill"></i> Start Processing
            </button>
        </form>
      </div>
    </div>

    <div id="status-container" class="mt-4"></div>
  </div>
</div>

<script>
    document.getElementById('cutForm').onsubmit = async (e) => {
        e.preventDefault();
        const jobId = "J" + Math.floor(Math.random() * 100000);
        const formData = new FormData(e.target);
        formData.append('job_id', jobId);

        const cardHtml = `
            <div id="card-${jobId}" class="card mb-3">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div>
                        <span class="fw-semibold">Job #${jobId}</span>
                        <span id="status-${jobId}" class="badge ms-2" style="background:var(--accent);">Initializing...</span>
                        <div id="spinner-${jobId}" class="spinner-border spinner-border-sm ms-2" style="color:var(--accent);"></div>
                    </div>
                    <button id="cancel-${jobId}" class="btn btn-sm btn-outline-danger" onclick="cancelJob('${jobId}')" title="Cancel job">
                        <i class="bi bi-x-circle"></i> Cancel
                    </button>
                </div>
                <div id="links-${jobId}" class="d-flex flex-wrap gap-2 mb-2"></div>
                <pre id="log-${jobId}" class="log-box" style="max-height:120px;"></pre>
              </div>
            </div>
        `;
        document.getElementById('status-container').insertAdjacentHTML('afterbegin', cardHtml);

        await fetch('/video-cut', { method: 'POST', body: formData });

        const interval = setInterval(async () => {
            const response = await fetch('/check-job/' + jobId);
            const data = await response.json();

            const cancellable = ['running','starting','downloading','cutting','unsilencing','skipping unsilence','cropping','skipping cropping','subtitling','skipping cutting','skipping subtitles'];
            if (cancellable.includes(data.status)) {
                document.getElementById('status-' + jobId).innerText = data.status;
            }
            else if (data.status === 'completed') {
                clearInterval(interval);
                document.getElementById('status-' + jobId).innerText = "Done!";
                document.getElementById('status-' + jobId).style.background = 'var(--accent2)';
                document.getElementById('card-' + jobId).style.borderColor = 'var(--accent2)';
                document.getElementById('spinner-' + jobId).remove();
                document.getElementById('cancel-' + jobId).remove();
                let links = `<a href='/editor/${jobId}' class='btn btn-sm btn-primary'>Edit</a>`;
                links += ` <a href='/download/${data.video}' class='btn btn-sm' style='background:var(--accent2);color:#fff;'>Download</a>`;
                if (data.srt) {
                    links += ` <a href='/download/${data.srt}' class='btn btn-sm btn-outline-secondary'>SRT</a>`;
                }
                document.getElementById('links-' + jobId).innerHTML = links;
            }
            else if (data.status === 'cancelled') {
                clearInterval(interval);
                document.getElementById('status-' + jobId).innerText = "Cancelled";
                document.getElementById('status-' + jobId).style.background = '#6c757d';
                document.getElementById('spinner-' + jobId).remove();
                document.getElementById('cancel-' + jobId).remove();
            }
            else if (data.status === 'error') {
                clearInterval(interval);
                document.getElementById('status-' + jobId).innerText = "Error";
                document.getElementById('status-' + jobId).style.background = 'var(--danger)';
                document.getElementById('spinner-' + jobId).remove();
                document.getElementById('cancel-' + jobId).remove();
                document.getElementById('log-' + jobId).textContent = data.msg || 'Unknown error';
            }

            if (data.log) {
                const logEl = document.getElementById('log-' + jobId);
                logEl.textContent = data.log.slice(-20).join("\n");
                logEl.scrollTop = logEl.scrollHeight;
            }
        }, 2000);
    };

    async function cancelJob(jobId) {
        const btn = document.getElementById('cancel-' + jobId);
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Cancelling...';
        }
        try {
            await fetch('/cancel-job/' + jobId, { method: 'POST' });
        } catch (e) {
            console.error('Cancel failed:', e);
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-x-circle"></i> Cancel';
            }
        }
    }

    // Toggle API key visibility
    document.getElementById('toggleKeyVisibility').addEventListener('click', function() {
        const input = document.getElementById('geminiKeyInput');
        const icon = this.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    });

    // Show/hide Gemini key field based on subtitle method
    document.getElementById('subtitleMethod').addEventListener('change', function() {
        const keyGroup = document.getElementById('geminiKeyGroup');
        keyGroup.style.display = this.value === 'whisper' ? 'none' : '';
    });
</script>
{% endblock %}
